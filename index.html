<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT SYNTH</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>
        СИНТЕЗАТОР ЧТОБЫ<br>
        ПОЧУВСТВОВАТЬ СЕБЯ В ЭДИТЕ
    </h1>


    <div class="visual">
        <img src="edit.gif">
    </div>


    <div class="panel">

        <div class="section">
            <h2>MAIN VOICE</h2>

            <button onclick="playLead(261)">A</button>
            <button onclick="playLead(329)">S</button>
            <button onclick="playLead(392)">D</button>
            <button onclick="playLead(523)">F</button>

            <label>
                DELAY
                <input type="range" min="0" max="1" step="0.1" id="delay">
            </label>

            <label>
                REVERB
                <input type="range" min="0" max="1" step="0.1" id="reverb">
            </label>

        </div>



        <div class="section">

            <h2>SHADOW VOICE</h2>

            <button onclick="playBass(130)">J</button>
            <button onclick="playBass(164)">K</button>
            <button onclick="playBass(196)">L</button>
            <button onclick="playBass(261)">;</button>


            <label>
                FILTER
                <input type="range" min="300" max="3000" id="filter">
            </label>

            <label>
                DISTORTION
                <input type="range" min="0" max="100" id="dist">
            </label>

        </div>


    </div>


</div>


<script src="script.js"></script>

</body>
</html>
